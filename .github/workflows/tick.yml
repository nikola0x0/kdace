# Runs the KDAce tick in the cloud: settle finished series, pick open ones, final calls, commit data/ back to main.
# Every 30 minutes, plus workflow_dispatch (manual, or the lock route's dispatcher when GITHUB_DISPATCH_TOKEN is set on Vercel).
name: tick

on:
  schedule:
    - cron: "7,37 * * * *" # every 30 minutes, off the top of the hour
  workflow_dispatch:

concurrency:
  group: tick
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Configure git for data commits
        run: |
          git config user.name "kdace-tick"
          git config user.email "kdace-tick@users.noreply.github.com"
      - name: Scout (fetch new games from the official lolesports feeds; the tick commits data/scout)
        # Runs dispatched early by the lock route (a result is in, a final call is due) skip it to get to the tick fast.
        # In supabase mode Scout is a runner stage writing to the store instead, so this step is skipped.
        if: github.event_name != 'workflow_dispatch' && vars.KDACE_STORE != 'supabase'
        run: npm run scout
        continue-on-error: true
        timeout-minutes: 8
      - name: Tick
        run: npm run tick
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MEMWAL_ACCOUNT_ID: ${{ secrets.MEMWAL_ACCOUNT_ID }}
          MEMWAL_PRIVATE_KEY: ${{ secrets.MEMWAL_PRIVATE_KEY }}
          MEMWAL_KEY_TOP: ${{ secrets.MEMWAL_KEY_TOP }}
          MEMWAL_KEY_JUNGLE: ${{ secrets.MEMWAL_KEY_JUNGLE }}
          MEMWAL_KEY_MID: ${{ secrets.MEMWAL_KEY_MID }}
          MEMWAL_KEY_ADC: ${{ secrets.MEMWAL_KEY_ADC }}
          MEMWAL_KEY_SUPPORT: ${{ secrets.MEMWAL_KEY_SUPPORT }}
          MEMWAL_SERVER_URL: https://relayer.memory.walrus.xyz
          TATUM_API_KEY: ${{ secrets.TATUM_API_KEY }}
          SUI_REFEREE_KEY: ${{ secrets.SUI_REFEREE_KEY }}
          SUI_NETWORK: ${{ vars.SUI_NETWORK }}
          TATUM_SUI_GRPC: ${{ vars.TATUM_SUI_GRPC }}
          KDACE_PACKAGE_ID: ${{ vars.KDACE_PACKAGE_ID }}
          KDACE_RESOLVER_CAP: ${{ vars.KDACE_RESOLVER_CAP }}
          # Fan commits are mirrored from Supabase (and the ping keeps the free project awake). Empty = fan stage skipped.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Unset (default): records in data/, committed by the tick. "supabase": the tick drains the staged runner
          # against Supabase under the shared runner lock (safe next to the Vercel cron) and commits nothing.
          KDACE_STORE: ${{ vars.KDACE_STORE }}
      - name: Verify (reads every commit back through Tatum)
        run: npm run verify
        env:
          TATUM_API_KEY: ${{ secrets.TATUM_API_KEY }}
          SUI_NETWORK: ${{ vars.SUI_NETWORK }}
          TATUM_SUI_GRPC: ${{ vars.TATUM_SUI_GRPC }}
          KDACE_PACKAGE_ID: ${{ vars.KDACE_PACKAGE_ID }}
          # Set to https://kdace.xyz/api/records after cutover to verify the live records; unset reads data/.
          KDACE_RECORDS_URL: ${{ vars.KDACE_RECORDS_URL }}
